const desk=document.querySelector('.desk'),count=document.querySelector('#count'),status=document.querySelector('.status');let popped=0,total=0,sound=false,ctx,held=false,tint='#d6e4c2',busy=false,generation=0;
// One shared output, bounded voices, and explicit resume after mobile interruptions.
let master,buffers=[],voices=new Set(),audioEpoch=0,lastSound=-Infinity;
function stopAudio(){audioEpoch++;for(const source of voices){try{source.stop()}catch{}}voices.clear();if(ctx&&master)master.gain.setValueAtTime(0,ctx.currentTime)}
function initAudio(){
 if(!ctx||ctx.state==='closed'){
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return false;
  ctx=new Audio();master=ctx.createGain();master.gain.value=sound?.48:0;master.connect(ctx.destination);buffers=[];
  for(let v=0;v<3;v++){const buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*.07),ctx.sampleRate),data=buffer.getChannelData(0);let smooth=0;for(let i=0;i<data.length;i++){const t=i/ctx.sampleRate;const attack=Math.min(1,t/.002);const envelope=attack*Math.exp(-t*(85+v*9))*Math.pow(1-i/data.length,2);smooth=.55*smooth+.45*(Math.random()*2-1);data[i]=(smooth*.72+Math.sin(2*Math.PI*(170+v*35)*t)*.28)*envelope}buffers.push(buffer)}
 }
 return true;
}
function unlockAudio(){
 if(!sound||document.hidden)return;
 try{if(!initAudio())return;master.gain.setValueAtTime(.48,ctx.currentTime);if(ctx.state!=='running'){const pending=ctx.resume();if(pending&&pending.catch)pending.catch(()=>{})}}
 catch(error){console.warn('音效暂不可用',error)}
}
async function audio(){
 if(!sound||document.hidden)return;const epoch=audioEpoch,requested=performance.now();
 try{
  if(!initAudio())return;
  if(ctx.state!=='running'){
   // Resume in the gesture; never queue a pop for a much later visit.
   let timer;await Promise.race([ctx.resume(),new Promise(resolve=>{timer=setTimeout(resolve,1200)})]).finally(()=>clearTimeout(timer));
  }
  if(epoch!==audioEpoch||!sound||document.hidden||ctx.state!=='running'||performance.now()-requested>1100)return;
  const now=ctx.currentTime;if(now-lastSound<.018)return;lastSound=now;
  if(voices.size>=5){const oldest=voices.values().next().value;oldest.stop();voices.delete(oldest)}
  master.gain.setValueAtTime(.48,now);
  const source=ctx.createBufferSource();source.buffer=buffers[Math.floor(Math.random()*buffers.length)];source.playbackRate.value=.94+Math.random()*.12;source.connect(master);voices.add(source);source.onended=()=>{voices.delete(source);source.disconnect()};source.start(now);
 }catch(error){console.warn('音效播放未完成',error)}
}
// The first tap must create/resume audio in a native click/touchend gesture.
// Touch pointerdown can precede activation; never consume the bubble there.
window.addEventListener('click',e=>{if(!e.target.closest('#sound'))unlockAudio()},{capture:true});
window.addEventListener('touchend',unlockAudio,{capture:true,passive:true});
window.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')unlockAudio()},{capture:true});
document.addEventListener('visibilitychange',()=>{held=false;if(document.hidden)stopAudio()});
window.addEventListener('pagehide',stopAudio);
function bindBubbleInput(){
 let origin=null,dragged=false,activePointer=null;
 desk.onpointerdown=e=>{
  if(e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
  held=true;origin={x:e.clientX,y:e.clientY};dragged=false;activePointer=e.pointerId;
  // Keep the native click. touch-action:none on the tray handles scrolling.
 };
 desk.onpointermove=e=>{
  if(!held||e.pointerId!==activePointer||!origin)return;
  if(!dragged&&Math.hypot(e.clientX-origin.x,e.clientY-origin.y)<8)return;
  if(!dragged){dragged=true;pop(document.elementFromPoint(origin.x,origin.y))}
  pop(document.elementFromPoint(e.clientX,e.clientY));
 };
 desk.onclick=e=>{
  // A native tap (or keyboard click) uses the same audio path as the sound toggle.
  // A drag already consumed its bubbles, so its compatibility click is ignored.
  if(dragged&&e.detail!==0){dragged=false;return}
  unlockAudio();pop(e.target.closest('.bubble'));
 };
 const release=e=>{if(activePointer===null||e.pointerId===activePointer){held=false;origin=null;activePointer=null}};
 window.addEventListener('pointerup',release);

}
function burst(b){
 const x=b.offsetLeft+b.offsetWidth/2,y=b.offsetTop+b.offsetHeight/2,size=b.offsetWidth;
 const base='--px:'+x+'px;--py:'+y+'px;--size:'+size+'px;--glow:'+tint+';';
 const add=(name,style='')=>{const p=document.createElement('i');p.className=name;p.setAttribute('aria-hidden','true');p.style.cssText=base+style;desk.append(p);setTimeout(()=>p.remove(),950)};
 add('burst-glow');add('burst-ring');add('burst-ring echo');
 for(let i=0;i<10;i++){const angle=i*Math.PI*2/10+Math.random()*.25,dist=size*(.65+Math.random()*.55);add('spark','--dx:'+Math.cos(angle)*dist+'px;--dy:'+Math.sin(angle)*dist+'px;background:'+(i%3===0?tint:'#fff')+';border-radius:'+(i%2?'50%':'1px')+';')}
 for(let i=0;i<6;i++)add('particle','--dx:'+(Math.random()*100-50)+'px;--dy:'+(Math.random()*95-60)+'px;--c:'+['#e5ad77','#f5edc9','#829a75'][i%3]+';');
}
function update(){desk.classList.toggle('is-clear',popped===30);document.querySelector('.progress i').style.transform='scaleX('+(popped/30)+')';count.textContent=popped===30?'这一把，清空了':'还剩 '+(30-popped)+' 个小烦恼';document.querySelector('#total').textContent=total}function pop(b){if(busy||!b||!b.classList.contains('bubble')||b.classList.contains('popped'))return;b.classList.add('popped');b.setAttribute('aria-pressed','true');b.tabIndex=-1;popped++;total++;update();audio();burst(b);if(popped===30)status.textContent='清空的是桌面，留给自己的是一点空间'}
function reset(){stopAudio();generation++;busy=false;document.querySelector('#sweep').disabled=false;popped=0;held=false;desk.classList.remove('sweep');desk.replaceChildren();const clear=document.createElement('div');clear.className='clear-note';clear.setAttribute('aria-hidden','true');clear.innerHTML='<div class="face">⌣</div><b>给心里，腾一点空</b><span>深呼吸，现在可以慢一点了</span>';desk.append(clear);const worry=document.querySelector('#worry').value.trim();for(let i=0;i<30;i++){let b=document.createElement('button'),row=Math.floor(i/5),col=i%5;const widths=[12,15,13,14,12];b.className='bubble';b.style.cssText='--s:clamp(40px,'+(widths[i%5]/1.7)+'vw,64px);--x:'+(7+col*18+(Math.random()*3-1.5))+'%;--y:'+(6+row*14+(Math.random()*1.4-.7))+'%;--r:'+(Math.random()*30-15)+'deg;--tint:'+tint+';--delay:'+(col*.025)+'s';b.textContent=worry&&i%5===2?worry:'';b.setAttribute('aria-label','捏掉第 '+(i+1)+' 个烦恼');b.setAttribute('aria-pressed','false');desk.append(b)}update();status.textContent=worry?'「'+worry+'」先放在这里，慢慢捏掉':'点一下，或按住划过去，不赶时间'}
bindBubbleInput();document.querySelector('#reset').onclick=reset;document.querySelector('#plant').onclick=()=>{reset();document.querySelector('#worry').blur()};document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♫ 声音已开':'♫ 声音已关';e.currentTarget.setAttribute('aria-pressed',String(sound));if(sound){unlockAudio();audio()}else stopAudio()};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{tint=b.dataset.color;desk.style.setProperty('--tray',tint+'99');document.querySelectorAll('[data-color]').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));document.querySelectorAll('.bubble').forEach(s=>s.style.setProperty('--tint',tint))});document.querySelector('#sweep').onclick=()=>{if(busy||popped===30)return;busy=true;held=false;let g=generation;document.querySelector('#sweep').disabled=true;desk.classList.add('sweep');audio();document.querySelectorAll('.bubble:not(.popped)').forEach((b,i)=>setTimeout(()=>{if(g===generation){burst(b);if(i%3===0)audio()}},i*12));setTimeout(()=>{if(g!==generation)return;total+=30-popped;popped=30;update();status.textContent='有时候，放过自己也可以这么干脆';busy=false;document.querySelector('#sweep').disabled=false;document.querySelectorAll('.bubble').forEach(b=>{b.classList.add('popped');b.tabIndex=-1;b.setAttribute('aria-pressed','true')})},800)};document.querySelector('#worry').onkeydown=e=>{if(e.key==='Enter'){reset();e.target.blur()}};reset();
</script></body></html>
